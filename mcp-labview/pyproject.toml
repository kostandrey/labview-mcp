[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labview-mcp"
version = "1.4.2"
description = "MCP stdio server for self-driving LabVIEW code generation (gateway scripting, VI extraction, NI docs, knowledge base)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["mcp", "labview", "vi-scripting", "code-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
labview-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = []   # single-module distribution on purpose
